# Alertmanager configuration for Eurtisan.
#
# In production, set one of the following environment variables in the
# alertmanager service so alerts actually reach an operator:
#   ALERTMANAGER_SMTP_HOST / ALERTMANAGER_SMTP_FROM / ALERTMANAGER_SMTP_TO
#   ALERTMANAGER_WEBHOOK_URL
#
# Local/dev deployments can run with the null receiver; alerts are logged but
# not sent anywhere.

global:
  smtp_smarthost: '${ALERTMANAGER_SMTP_HOST:localhost:25}'
  smtp_from: '${ALERTMANAGER_SMTP_FROM:alerts@example.com}'
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      continue: true

receivers:
  - name: default
    email_configs:
      - to: '${ALERTMANAGER_SMTP_TO:}'
        send_resolved: true
        headers:
          Subject: 'Eurtisan alert: {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:}'
        send_resolved: true

  - name: critical
    email_configs:
      - to: '${ALERTMANAGER_SMTP_TO:}'
        send_resolved: true
        headers:
          Subject: 'Eurtisan CRITICAL alert: {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
