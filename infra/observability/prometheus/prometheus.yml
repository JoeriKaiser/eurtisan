global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['eurtisan-alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'eurtisan'
    metrics_path: /api/metrics
    # The /api/metrics endpoint requires METRICS_TOKEN in production.
    # This file is rendered by Ansible from infra/observability/prometheus/prometheus.yml
    # so the token is never committed to version control.
    params:
      token: ["{{ metrics_token | default('') }}"]
    static_configs:
      - targets: ['eurtisan-app:3000']

  - job_name: 'eurtisan-financial-totals-reconciliation'
    metrics_path: /metrics
    params:
      token: ["{{ metrics_token | default('') }}"]
    static_configs:
      - targets: ['financial-totals-reconciliation:3001']

  - job_name: 'alloy'
    static_configs:
      - targets: ['eurtisan-alloy:12345']
