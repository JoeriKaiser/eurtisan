global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'eurtisan-app'
    static_configs:
      - targets: ['eurtisan-app-staging:3000']
    metrics_path: /metrics
    # The app does not currently expose /metrics. This is forward-looking.
    # If /metrics is unavailable, Prometheus will log scrape errors (harmless).

  - job_name: 'alloy'
    static_configs:
      - targets: ['eurtisan-alloy:12345']
