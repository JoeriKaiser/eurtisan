global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'eurtisan'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['eurtisan-app:3000']

  - job_name: 'alloy'
    static_configs:
      - targets: ['eurtisan-alloy:12345']
