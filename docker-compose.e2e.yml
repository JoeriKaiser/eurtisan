# Overlay for `make e2e` — point the app at the isolated test database.
services:
  app:
    environment:
      DATABASE_URL: postgresql://eurtisan:eurtisan@db-test:5432/eurtisan_test
      E2E_TEST: "true"
      MAILPIT_API_URL: http://mailpit:8025/api/v1
    depends_on:
      db-test:
        condition: service_healthy
