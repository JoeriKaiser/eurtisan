groups:
  - name: meilisearch_health
    rules:
      - alert: EurtisanMeilisearchDisconnected
        expr: eurtisan_health_meilisearch_connected == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Eurtisan Meilisearch connectivity check failed
          description: The /api/health/ready Meilisearch check has been failing for more than 1 minute.
