deployment_environment: staging
release_registry_self_hosted: true
release_registry: registry-staging.eurtisan.eu
release_image_repository: registry-staging.eurtisan.eu/eurtisan/app
registry_push_access_key_id: "{{ staging_registry_push_username }}"
registry_push_secret_key: "{{ staging_registry_push_password }}"
registry_pull_access_key_id: "{{ staging_registry_pull_username }}"
registry_pull_secret_key: "{{ staging_registry_pull_password }}"
registry_http_secret: "{{ staging_registry_http_secret }}"
garage_enabled: true
garage_public_domain: s3-staging.eurtisan.eu
s3_endpoint: http://garage:3900
s3_public_endpoint: https://s3-staging.eurtisan.eu
s3_region: garage
s3_bucket: eurtisan-staging-uploads
mollie_test_mode: true
sendcloud_force_unstamped_letter: true
email_delivery_provider: smtp
email_smtp_host: mailpit
email_smtp_port: "1025"
email_from_address: noreply@staging.eurtisan.eu
app_container_name: eurtisan-app-staging
db_container_name: eurtisan-db-staging
# Exercise encrypted physical backups and WAL/PITR locally before a remote
# repository is available. This does not satisfy the off-site production gate.
postgres_wal_archive_enabled: true
pgbackrest_repository_type: posix
faro_sample_rate: "1"
