# ── Repository / Git ────────────────────────────────────────────────────
# GitHub is the canonical source. Codeberg is maintained as a mirror.
repository_url: "https://github.com/JoeriKaiser/eurtisan.git"

# ── Database ─────────────────────────────────────────────────────────────
postgres_user: eurtisan
postgres_db: eurtisan

# ── Email ────────────────────────────────────────────────────────────────
# Production should use the dedicated transactional subdomain once it is
# verified in Brevo (see docs/EMAIL_DNS.md). Until then, keep the root domain.
email_from_address: noreply@mail.eurtisan.eu
email_from_name: Eurtisan
email_smtp_port: "587"

# ── Secrets ──────────────────────────────────────────────────────────────
# DO NOT PUT REAL SECRETS HERE.
# Override these at runtime with: ansible-playbook ... -e @secrets.yml
#
# Example secrets.yml:
#   postgres_password: "your-strong-password"
#   better_auth_secret: "$(openssl rand -base64 32)"
#   meilisearch_api_key: "$(openssl rand -base64 32)"
#   meilisearch_search_key: "generate-via-meilisearch-keys-api"
#
# Optional — webhook URL for backup failure alerts (e.g. Slack, Discord, OpsGenie).
#   backup_alert_webhook: "https://hooks.slack.com/services/..."
#
# Optional — webhook URL for deploy failure/success alerts.
#   deploy_alert_webhook: "https://hooks.slack.com/services/..."
#
# Optional — restrict staging access to specific IPs (comma-separated).
# Only used when coexist_with_proxy is false (standalone staging).
#   allowed_ips: "REDACTED.1,REDACTED.2"
#
# Optional — Umami cookie-less analytics.
#   umami_script_url: "https://analytics.example.com/script.js"
#   umami_website_id: "your-website-uuid"
#   umami_host_url: "https://analytics.example.com"

# ── Backups ──────────────────────────────────────────────────────────────
# Local retention for nightly PostgreSQL dumps and Meilisearch dumps.
backup_retention_days: 30

# Off-site retention (days) for rclone-backed backups. Prefer bucket lifecycle
# rules when available; the backup script falls back to `rclone delete`.
backup_offsite_retention_days: 90

# rclone remote for off-site backups, e.g. "eurtisan-backups:eurtisan"
backup_offsite_rclone_remote: ""

# rclone remote/path for S3 uploads secondary sync, e.g. "eurtisan-backups:uploads"
backup_s3_uploads_rclone_remote: ""

# Token used by the backup script to report success/failure to /api/backup-report.
# Override in secrets.yml.
backup_report_token: ""

# PostgreSQL WAL archiving (enable for production PITR — see docs/DEPLOYMENT.md)
postgres_wal_archive_enabled: false

# Local or object-storage path for WAL segments. For object storage, use
# rclone/wal-g/pgbackrest; the default local path is only suitable for testing.
postgres_wal_archive_path: "/opt/eurtisan/backups/wal"

# Optional S3-compatible destination for WAL archives. When these are set,
# Ansible configures PostgreSQL to ship WAL segments to the bucket via aws s3 cp.
postgres_wal_archive_s3_bucket: ""
postgres_wal_archive_s3_endpoint: ""
postgres_wal_archive_s3_region: ""
postgres_wal_archive_s3_access_key: ""
postgres_wal_archive_s3_secret_key: ""
