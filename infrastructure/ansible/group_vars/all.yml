# ── Repository / Git ────────────────────────────────────────────────────
# GitHub is the canonical source. Codeberg is maintained as a mirror.
repository_url: "git@github.com:JoeriKaiser/eurtisan.git"
repository_deploy_key_path: "/root/.ssh/eurtisan_github_deploy"

# ── Signed release channel ───────────────────────────────────────────────
# Production keeps release artifacts in Scaleway's private fr-par registry.
# Staging overrides this with a private registry on the existing staging VPS.
# Registry credentials and the Cosign key password belong in Ansible Vault.
release_registry_self_hosted: false
release_registry: "rg.fr-par.scw.cloud"
release_image_repository: "rg.fr-par.scw.cloud/eurtisan/app"
release_registry_minimum_retained_generations: 2
release_registry_retention_days: 30
release_registry_root: "/opt/eurtisan-release-registry"
release_registry_data_path: "{{ release_registry_root }}/data"
release_signing_private_key_path: "{{ lookup('env', 'HOME') }}/.config/eurtisan/cosign.key"
release_signing_public_key_path: "{{ lookup('env', 'HOME') }}/.config/eurtisan/cosign.pub"

# ── Database ─────────────────────────────────────────────────────────────
postgres_user: eurtisan
postgres_db: eurtisan

# ── Launch integration contract ─────────────────────────────────────────
meilisearch_enabled: true
s3_storage_enabled: true
garage_enabled: false
imgproxy_enabled: true
mollie_payments_enabled: true
mollie_connect_enabled: true
sendcloud_enabled: true
faro_enabled: true
umami_enabled: false
enable_vies_validation: false
platform_vat_liable: true
financial_totals_reconciliation_interval_ms: "21600000"
financial_totals_reconciliation_batch_size: "500"

# Production uses Scaleway S3-compatible object storage. Staging overrides
# these values with its private Garage service and dedicated public S3 domain.
s3_endpoint: "https://s3.fr-par.scw.cloud"
s3_public_endpoint: "https://s3.fr-par.scw.cloud"
s3_region: "fr-par"
s3_uploads_bucket: "{{ s3_bucket }}"
faro_sample_rate: "0.1"

# ── Email ────────────────────────────────────────────────────────────────
# Production should use the dedicated transactional subdomain once it is
# verified in Brevo (see docs/EMAIL_DNS.md). Until then, keep the root domain.
email_from_address: noreply@mail.eurtisan.eu
email_from_name: Eurtisan
email_reply_to_address: support@eurtisan.eu
email_smtp_port: "587"

# ── Secrets ──────────────────────────────────────────────────────────────
# DO NOT PUT REAL SECRETS HERE.
# Override these at runtime with: ansible-playbook ... -e @secrets.yml
#
# Example secrets.yml:
#   postgres_password: "your-strong-password"
#   better_auth_secret: "$(openssl rand -base64 32)"
#   meilisearch_api_key: "$(openssl rand -base64 32)"
#   database_encryption_key: "generate with: openssl rand -base64 32"
#   meilisearch_search_key: "generate-via-meilisearch-keys-api"
#   s3_access_key_id: "storage access key"
#   s3_secret_access_key: "storage secret key"
#   imgproxy_key: "generate with: openssl rand -hex 32"
#   imgproxy_salt: "generate with: openssl rand -hex 32"
#   mollie_api_key: "provider key"
#   mollie_client_id: "provider application id"
#   mollie_client_secret: "provider application secret"
#   sendcloud_public_key: "provider public key"
#   sendcloud_secret_key: "provider secret key"
#   sendcloud_webhook_secret: "dedicated webhook secret"
#   staging_registry_push_username: "controller-only staging registry username"
#   staging_registry_push_password: "controller-only staging registry password"
#   staging_registry_pull_username: "staging VPS pull-only registry username"
#   staging_registry_pull_password: "staging VPS pull-only registry password"
#   staging_registry_http_secret: "staging registry internal HTTP secret"
#   registry_push_access_key_id: "production controller registry IAM access key"
#   registry_push_secret_key: "production controller registry IAM secret key"
#   registry_pull_access_key_id: "production target pull-only IAM access key"
#   registry_pull_secret_key: "production target pull-only secret key"
#   cosign_password: "password protecting the offline Cosign private key"
#   promoted_staging_image_digest: "sha256:<qualified-staging-digest>" # production only
#
# Optional — webhook URL for backup failure alerts (e.g. Slack, Discord, OpsGenie).
#   backup_alert_webhook: "https://hooks.slack.com/services/..."
#
# Optional — webhook URL for deploy failure/success alerts.
#   deploy_alert_webhook: "https://hooks.slack.com/services/..."
#
# Optional — restrict staging access to specific IPs (comma-separated).
# Only used when coexist_with_proxy is false (standalone staging).
#   allowed_ips: "REDACTED.1,REDACTED.2"
#
# Optional — Umami cookie-less analytics.
#   umami_script_url: "https://analytics.example.com/script.js"
#   umami_website_id: "your-website-uuid"
#   umami_host_url: "https://analytics.example.com"

# ── Backups ──────────────────────────────────────────────────────────────
# Local retention for nightly PostgreSQL dumps and Meilisearch dumps.
backup_retention_days: 30

# Off-site retention (days) for rclone-backed backups. Prefer bucket lifecycle
# rules when available; the backup script falls back to `rclone delete`.
backup_offsite_retention_days: 90

# Webhook posted to when a rollout finishes, so a failed deploy is not silent.
# Any endpoint accepting a JSON POST (Slack/Discord/Alertmanager). Empty
# disables notification entirely.
deploy_notification_webhook: ""

# rclone remote for off-site backups, e.g. "eurtisan-backups:eurtisan"
backup_offsite_rclone_remote: ""

# rclone remote/path for S3 uploads secondary sync, e.g. "eurtisan-backups:uploads"
backup_s3_uploads_rclone_remote: ""

# Token used by the backup script to report success/failure to /api/backup-report.
# Override in secrets.yml.
backup_report_token: ""

# PostgreSQL WAL archiving (enable for production PITR — see docs/DEPLOYMENT.md)
postgres_wal_archive_enabled: false

# Local or object-storage path for WAL segments. For object storage, use
# rclone/wal-g/pgbackrest; the default local path is only suitable for testing.
postgres_wal_archive_path: "/opt/eurtisan/backups/wal"

# Optional S3-compatible destination for WAL archives. When these are set,
# Ansible configures PostgreSQL to ship WAL segments to the bucket via aws s3 cp.
postgres_wal_archive_s3_bucket: ""
postgres_wal_archive_s3_endpoint: ""
postgres_wal_archive_s3_region: ""
postgres_wal_archive_s3_access_key: ""
postgres_wal_archive_s3_secret_key: ""
