---
- name: Validate deployment configuration before changing the host
  ansible.builtin.import_tasks: preflight.yml

- name: Determine compose file
  set_fact:
    compose_file: "{{ 'docker-compose.staging.yml' if (coexist_with_proxy | default(false)) else 'docker-compose.prod.yml' }}"

- name: Determine if direct port access override is needed
  set_fact:
    use_port_override: "{{ (coexist_with_proxy | default(false)) and (app_access_ips is defined) }}"

- name: Write Docker Compose override for direct port access
  when: use_port_override
  copy:
    dest: /opt/eurtisan/docker-compose.override.yml
    content: |
      services:
        app:
          ports:
            - "0.0.0.0:3001:3000"

- name: Determine Docker Compose command
  set_fact:
    docker_compose: "docker compose -f {{ compose_file }}{% if use_port_override %} -f docker-compose.override.yml{% endif %}{% if postgres_wal_archive_enabled | default(false) %} -f docker-compose.wal-archive.yml{% endif %}"

- name: Create application directory
  file:
    path: /opt/eurtisan
    state: directory
    mode: "0755"

- name: Clone canonical repository
  git:
    repo: "{{ repository_url }}"
    dest: /opt/eurtisan
    version: "{{ git_branch | default('main') }}"
    force: yes
  register: repository_checkout

- name: Set immutable release and image identifiers
  set_fact:
    release_version: "{{ repository_checkout.after }}"
    image_tag: "{{ repository_checkout.after[:12] }}"

- name: Write production environment file
  template:
    src: .env.j2
    dest: /opt/eurtisan/.env
    mode: "0600"

- name: Write deploy script
  copy:
    src: deploy.sh
    dest: /opt/eurtisan/deploy.sh
    mode: "0755"

- name: Write database backup script
  template:
    src: backup.sh.j2
    dest: /opt/eurtisan/backup.sh
    mode: "0755"

- name: Create eurtisan-backup user
  user:
    name: eurtisan-backup
    system: yes
    shell: /bin/false
    groups: docker
    append: yes

- name: Ensure backup directory exists and is writable
  file:
    path: /opt/eurtisan/backups
    state: directory
    owner: eurtisan-backup
    group: eurtisan-backup
    mode: "0755"

- name: Ensure backup log file is writable
  file:
    path: /var/log/eurtisan-backup.log
    state: touch
    owner: eurtisan-backup
    group: eurtisan-backup
    mode: "0644"

- name: Install rclone for off-site backups
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
  tags: [backup]

- name: Ensure WAL archive directory exists
  when: postgres_wal_archive_enabled | default(false)
  file:
    path: "{{ postgres_wal_archive_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [backup, wal]

- name: Render WAL archive command wrapper
  when: postgres_wal_archive_enabled | default(false)
  template:
    src: wal-archive.sh.j2
    dest: /opt/eurtisan/wal-archive.sh
    mode: "0755"
  tags: [backup, wal]

- name: Install AWS CLI when WAL S3 archiving is configured
  when:
    - postgres_wal_archive_enabled | default(false)
    - postgres_wal_archive_s3_bucket | default('') | length > 0
  apt:
    name: awscli
    state: present
    update_cache: true
  tags: [backup, wal]

- name: Write WAL archiving Compose override
  when: postgres_wal_archive_enabled | default(false)
  copy:
    dest: /opt/eurtisan/docker-compose.wal-archive.yml
    content: |
      services:
        db:
          command: >
            postgres
            -c wal_level=replica
            -c archive_mode=on
            -c archive_command='/opt/eurtisan/wal-archive.sh %f %p'
            -c max_wal_senders=3
          volumes:
            - "/opt/eurtisan/wal-archive.sh:/opt/eurtisan/wal-archive.sh:ro"
            - "{{ postgres_wal_archive_path }}:{{ postgres_wal_archive_path }}"
  tags: [backup, wal]

- name: Schedule nightly database backups
  cron:
    name: "Eurtisan database backup"
    minute: "0"
    hour: "3"
    job: "/opt/eurtisan/backup.sh >> /var/log/eurtisan-backup.log 2>&1"
    user: eurtisan-backup

- name: Schedule nightly Docker dangling-image cleanup
  cron:
    name: "Eurtisan Docker cleanup"
    minute: "0"
    hour: "4"
    job: "docker image prune -f > /dev/null 2>&1"
    user: root

- name: Start observability stack
  block:
    - name: Ensure eurtisan Docker network exists
      command: docker network create eurtisan
      failed_when: false
      register: network_result
      changed_when: network_result.rc == 0

    - name: Create observability directory
      file:
        path: /opt/eurtisan/observability
        state: directory
        mode: "0755"

    - name: Sync observability compose and configs
      synchronize:
        src: "{{ playbook_dir }}/../../infra/observability/"
        dest: /opt/eurtisan/observability/
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=prometheus/prometheus.yml"

    - name: Render Prometheus scrape config with metrics token
      template:
        src: "{{ playbook_dir }}/../../infra/observability/prometheus/prometheus.yml"
        dest: /opt/eurtisan/observability/prometheus/prometheus.yml
        mode: "0644"

    - name: Ensure observability stack is running
      command: "docker compose -f /opt/eurtisan/observability/docker-compose.observability.yml --env-file /opt/eurtisan/.env up -d --force-recreate"
      args:
        chdir: /opt/eurtisan/observability
  tags: [observability]

- name: Start database and meilisearch first
  command: "{{ docker_compose }} up -d db meilisearch"
  args:
    chdir: /opt/eurtisan

- name: Wait for PostgreSQL to be ready
  shell: "{{ docker_compose }} exec -T db pg_isready -U {{ postgres_user }}"
  args:
    chdir: /opt/eurtisan
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 15
  delay: 2

- name: Build application image
  command: "{{ docker_compose }} build app"
  args:
    chdir: /opt/eurtisan
  environment:
    IMAGE_TAG: "{{ image_tag }}"
  async: 1800
  poll: 15

- name: Smoke-test compiled browser configuration
  command: "docker run --rm --env-file /opt/eurtisan/.env eurtisan-app:{{ image_tag }} bun run smoke:client-config"
  args:
    chdir: /opt/eurtisan

- name: Validate server environment inside the production image
  command: "{{ docker_compose }} run --rm --no-deps app bun run validate:server-env"
  args:
    chdir: /opt/eurtisan
  environment:
    IMAGE_TAG: "{{ image_tag }}"

- name: Run database migrations
  command: "{{ docker_compose }} run --rm app bun run db:migrate"
  args:
    chdir: /opt/eurtisan
  environment:
    IMAGE_TAG: "{{ image_tag }}"

- name: Start all services
  command: "{{ docker_compose }} up -d"
  args:
    chdir: /opt/eurtisan
  environment:
    IMAGE_TAG: "{{ image_tag }}"

- name: Tag deployed image as latest
  command: "docker tag eurtisan-app:{{ image_tag }} eurtisan-app:latest"

- name: Write Traefik dynamic config for staging route
  when: coexist_with_proxy | default(false)
  block:
    - name: Write Traefik router, service, and whitelist config (single atomic file)
      copy:
        dest: /data/coolify/proxy/dynamic/eurtisan-staging.yml
        content: |
          http:
            routers:
              eurtisan-staging-http:
                rule: "Host(`staging.eurtisan.eu`)"
                entrypoints:
                  - http
                middlewares:
                  - eurtisan-staging-redirect

              # Faro collector — must be public (receives client beacons from all IPs)
              # Higher priority so it matches before the catch-all app route.
              eurtisan-staging-collect:
                rule: "Host(`staging.eurtisan.eu`) && PathPrefix(`/collect`)"
                priority: 10
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-collect
                middlewares:
                  - eurtisan-staging-strip-collect

              # Public image delivery through imgproxy. The prefix is stripped
              # so imgproxy receives its native signed/insecure path.
              eurtisan-staging-uploads:
                rule: "Host(`staging.eurtisan.eu`) && PathPrefix(`/uploads/`)"
                priority: 10
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-imgproxy
                middlewares:
                  - eurtisan-staging-strip-uploads

              # Browser search uses only the restricted search-only key.
              eurtisan-staging-meilisearch:
                rule: "Host(`staging.eurtisan.eu`) && PathPrefix(`/meilisearch/`)"
                priority: 10
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-meilisearch
                middlewares:
                  - eurtisan-staging-strip-meilisearch

              # Grafana UI — behind the same IP whitelist as the app.
              # Higher priority so it matches before the catch-all app route.
              # DO NOT strip /grafana — Grafana with serve_from_sub_path=true
              # expects to receive the full subpath and strips it internally.
              eurtisan-staging-grafana:
                rule: "Host(`staging.eurtisan.eu`) && PathPrefix(`/grafana`)"
                priority: 10
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-grafana
          {% if allowed_ips is defined %}
                middlewares:
                  - eurtisan-staging-whitelist
          {% endif %}

              # Main app — catch-all for everything else.
              # Lower priority so /collect and /grafana match first.
              eurtisan-staging-app:
                rule: "Host(`staging.eurtisan.eu`)"
                priority: 1
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-app
          {% if allowed_ips is defined %}
                middlewares:
                  - eurtisan-staging-whitelist
          {% endif %}

            middlewares:
              eurtisan-staging-redirect:
                redirectScheme:
                  scheme: https
                  permanent: true

              eurtisan-staging-strip-collect:
                stripPrefix:
                  prefixes:
                    - "/collect"

              eurtisan-staging-strip-uploads:
                stripPrefix:
                  prefixes:
                    - "/uploads"

              eurtisan-staging-strip-meilisearch:
                stripPrefix:
                  prefixes:
                    - "/meilisearch"

          {% if allowed_ips is defined %}
              eurtisan-staging-whitelist:
                ipWhiteList:
                  sourceRange:
          {% for ip in allowed_ips.split(',') %}
                    - "{{ ip }}/32"
          {% endfor %}
          {% endif %}

            services:
              eurtisan-staging-app:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-app-staging:3000"

              eurtisan-staging-collect:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-alloy:8027"

              eurtisan-staging-imgproxy:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-imgproxy-staging:8080"

              eurtisan-staging-meilisearch:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-meilisearch-staging:7700"

              eurtisan-staging-grafana:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-grafana:3000"

    - name: Remove old separate whitelist file (if any)
      file:
        path: /data/coolify/proxy/dynamic/eurtisan-staging-whitelist.yml
        state: absent
      ignore_errors: true

    - name: Restart app to pick up Traefik config
      command: "{{ docker_compose }} up -d app"
      args:
        chdir: /opt/eurtisan
      environment:
        IMAGE_TAG: "{{ image_tag }}"

- name: Expose app port directly (optional, when app_access_ips is set)
  when:
    - coexist_with_proxy | default(false)
    - app_access_ips is defined
  block:
    - name: Allow app port from whitelisted IPs via UFW
      ufw:
        rule: allow
        from_ip: "{{ item }}"
        port: "3001"
        proto: tcp
      loop: "{{ app_access_ips.split(',') }}"

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Restart app with override binding
      command: "{{ docker_compose }} up -d app"
      args:
        chdir: /opt/eurtisan
      environment:
        IMAGE_TAG: "{{ image_tag }}"
