---
- name: Determine compose file
  set_fact:
    compose_file: "{{ 'docker-compose.staging.yml' if (coexist_with_proxy | default(false)) else 'docker-compose.prod.yml' }}"

- name: Create application directory
  file:
    path: /opt/eurtisan
    state: directory
    mode: "0755"

- name: Clone Codeberg repository
  git:
    repo: "https://codeberg.org/{{ codeberg_user }}/{{ codeberg_repo }}.git"
    dest: /opt/eurtisan
    version: "{{ git_branch | default('main') }}"
    force: yes

- name: Write production environment file
  template:
    src: .env.j2
    dest: /opt/eurtisan/.env
    mode: "0600"

- name: Write deploy script
  copy:
    src: deploy.sh
    dest: /opt/eurtisan/deploy.sh
    mode: "0755"

- name: Write database backup script
  copy:
    dest: /opt/eurtisan/backup.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      COMPOSE_FILE="{{ compose_file }}"
      BACKUP_DIR="/opt/eurtisan/backups"
      mkdir -p "$BACKUP_DIR"
      docker compose -f "/opt/eurtisan/$COMPOSE_FILE" exec -T db pg_dump -U {{ postgres_user }} {{ postgres_db }} | gzip > "$BACKUP_DIR/eurtisan-$(date +%Y%m%d-%H%M%S).sql.gz"
      find "$BACKUP_DIR" -name "*.sql.gz" -mtime +7 -delete
      echo "Backup completed at $(date)"
    mode: "0755"

- name: Schedule nightly database backups
  cron:
    name: "Eurtisan database backup"
    minute: "0"
    hour: "3"
    job: "/opt/eurtisan/backup.sh >> /var/log/eurtisan-backup.log 2>&1"
    user: root

- name: Start observability stack
  block:
    - name: Ensure eurtisan Docker network exists
      command: docker network create eurtisan
      ignore_errors: true
      register: network_result
      changed_when: network_result.rc == 0

    - name: Create observability directory
      file:
        path: /opt/eurtisan/observability
        state: directory
        mode: "0755"

    - name: Sync observability compose and configs
      synchronize:
        src: "{{ playbook_dir }}/../../infra/observability/"
        dest: /opt/eurtisan/observability/
        delete: yes
        rsync_opts:
          - "--exclude=.git"

    - name: Ensure observability stack is running
      command: "docker compose -f /opt/eurtisan/observability/docker-compose.observability.yml up -d"
      args:
        chdir: /opt/eurtisan/observability
  tags: [observability]

- name: Start database and meilisearch first
  command: "docker compose -f {{ compose_file }} up -d db meilisearch"
  args:
    chdir: /opt/eurtisan

- name: Wait for PostgreSQL to be ready
  shell: "docker compose -f {{ compose_file }} exec -T db pg_isready -U {{ postgres_user }}"
  args:
    chdir: /opt/eurtisan
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 15
  delay: 2

- name: Build application image
  command: "docker compose -f {{ compose_file }} build app"
  args:
    chdir: /opt/eurtisan

- name: Run database migrations
  command: "docker compose -f {{ compose_file }} run --rm app bun run db:migrate"
  args:
    chdir: /opt/eurtisan

- name: Start all services
  command: "docker compose -f {{ compose_file }} up -d"
  args:
    chdir: /opt/eurtisan

- name: Write Traefik dynamic config for staging route
  when: coexist_with_proxy | default(false)
  block:
    - name: Write Traefik router, service, and whitelist config (single atomic file)
      copy:
        dest: /data/coolify/proxy/dynamic/eurtisan-staging.yml
        content: |
          http:
            routers:
              eurtisan-staging-http:
                rule: "Host(`staging.eurtisan.eu`)"
                entrypoints:
                  - http
                middlewares:
                  - eurtisan-staging-redirect

              # Faro collector — must be public (receives client beacons from all IPs)
              # Higher priority so it matches before the catch-all app route.
              eurtisan-staging-collect:
                rule: "Host(`staging.eurtisan.eu`) && PathPrefix(`/collect`)"
                priority: 10
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-collect
                middlewares:
                  - eurtisan-staging-strip-collect

              # Grafana UI — behind the same IP whitelist as the app.
              # Higher priority so it matches before the catch-all app route.
              # DO NOT strip /grafana — Grafana with serve_from_sub_path=true
              # expects to receive the full subpath and strips it internally.
              eurtisan-staging-grafana:
                rule: "Host(`staging.eurtisan.eu`) && PathPrefix(`/grafana`)"
                priority: 10
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-grafana
          {% if allowed_ips is defined %}
                middlewares:
                  - eurtisan-staging-whitelist
          {% endif %}

              # Main app — catch-all for everything else.
              # Lower priority so /collect and /grafana match first.
              eurtisan-staging-app:
                rule: "Host(`staging.eurtisan.eu`)"
                priority: 1
                entrypoints:
                  - https
                tls:
                  certResolver: letsencrypt
                service: eurtisan-staging-app
          {% if allowed_ips is defined %}
                middlewares:
                  - eurtisan-staging-whitelist
          {% endif %}

            middlewares:
              eurtisan-staging-redirect:
                redirectScheme:
                  scheme: https
                  permanent: true

              eurtisan-staging-strip-collect:
                stripPrefix:
                  prefixes:
                    - "/collect"

          {% if allowed_ips is defined %}
              eurtisan-staging-whitelist:
                ipWhiteList:
                  sourceRange:
          {% for ip in allowed_ips.split(',') %}
                    - "{{ ip }}/32"
          {% endfor %}
          {% endif %}

            services:
              eurtisan-staging-app:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-app-staging:3000"

              eurtisan-staging-collect:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-alloy:8027"

              eurtisan-staging-grafana:
                loadBalancer:
                  servers:
                    - url: "http://eurtisan-grafana:3000"

    - name: Remove old separate whitelist file (if any)
      file:
        path: /data/coolify/proxy/dynamic/eurtisan-staging-whitelist.yml
        state: absent
      ignore_errors: true

    - name: Restart app to pick up Traefik config
      command: "docker compose -f {{ compose_file }} up -d app"
      args:
        chdir: /opt/eurtisan

- name: Expose app port directly (optional, when app_access_ips is set)
  when:
    - coexist_with_proxy | default(false)
    - app_access_ips is defined
  block:
    - name: Allow app port from whitelisted IPs via UFW
      ufw:
        rule: allow
        from_ip: "{{ item }}"
        port: "3001"
        proto: tcp
      loop: "{{ app_access_ips.split(',') }}"

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Update compose to bind app to all interfaces
      replace:
        path: "/opt/eurtisan/{{ compose_file }}"
        regexp: '127\.0\.0\.1:3001:3000'
        replace: '0.0.0.0:3001:3000'

    - name: Restart app with new binding
      command: "docker compose -f {{ compose_file }} up -d app"
      args:
        chdir: /opt/eurtisan