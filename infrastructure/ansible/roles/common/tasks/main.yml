---
- name: Check if swap is enabled
  command: swapon --show
  register: swap_check
  changed_when: false

- name: Provision swap space if missing
  when: swap_check.stdout == ""
  block:
    - name: Create 4GB swap file
      command: fallocate -l 4G /swapfile
    - name: Set swap file permissions
      file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
    - name: Make swap space
      command: mkswap /swapfile
    - name: Enable swap space
      command: swapon /swapfile
    - name: Persist swap file in fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

- name: Find conflicting Docker APT source files
  find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*docker*"
      - "*download.docker*"
    file_type: file
  register: docker_apt_sources

- name: Remove conflicting Docker APT source files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_apt_sources.files }}"
  when: docker_apt_sources.files | length > 0

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Check if Docker is already installed
  command: which docker
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: Install essential system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - git
      - ufw
      - fail2ban
      - unattended-upgrades
      - jq
      - python3
      - python3-pip
    state: present

- name: Ensure APT keyring directory exists
  when: docker_check.rc != 0
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository signing key
  when: docker_check.rc != 0
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker APT repository
  when: docker_check.rc != 0
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and Compose plugin
  when: docker_check.rc != 0
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes

- name: Configure Docker daemon log rotation
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"
    validate: python3 -m json.tool %s
  notify: Restart docker

- name: Allow SSH through UFW
  when: not (coexist_with_proxy | default(false))
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP from whitelisted IPs
  when:
    - not (coexist_with_proxy | default(false))
    - allowed_ips is defined
  ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "80"
    proto: tcp
  loop: "{{ allowed_ips.split(',') }}"

- name: Allow HTTPS from whitelisted IPs
  when:
    - not (coexist_with_proxy | default(false))
    - allowed_ips is defined
  ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "443"
    proto: tcp
  loop: "{{ allowed_ips.split(',') }}"

- name: Allow HTTP through UFW (open access)
  when:
    - not (coexist_with_proxy | default(false))
    - allowed_ips is not defined
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS through UFW (open access)
  when:
    - not (coexist_with_proxy | default(false))
    - allowed_ips is not defined
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW with default-deny policy
  when: not (coexist_with_proxy | default(false))
  ufw:
    state: enabled
    policy: deny

- name: Configure fail2ban defaults
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5

      [sshd]
      enabled = true
  notify: Restart fail2ban

- name: Enable unattended security upgrades
  copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::InstallOnShutdown "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
