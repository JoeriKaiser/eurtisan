---
- name: Configure Eurtisan VPS
  hosts: all
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Get SSH host key
      ansible.builtin.command: ssh-keyscan -H "{{ ansible_host | default(inventory_hostname) }}"
      register: ssh_keyscan_output
      delegate_to: localhost
      changed_when: false
      become: no
      tags: [always]

    - name: Ensure target host is in known_hosts
      ansible.builtin.known_hosts:
        name: "{{ ansible_host | default(inventory_hostname) }}"
        key: "{{ item }}"
        state: present
      loop: "{{ ssh_keyscan_output.stdout_lines | reject('match', '^#') | list }}"
      delegate_to: localhost
      become: no
      tags: [always]

    - name: Validate Grafana password is set
      ansible.builtin.fail:
        msg: "grafana_admin_password must be set in secrets.yml"
      when: grafana_admin_password is not defined or grafana_admin_password == ''
      tags: [always]

    - name: Validate metrics scrape token is set
      ansible.builtin.fail:
        msg: "metrics_token must be set in secrets.yml (run 'make infra-secrets' to generate one)"
      when: metrics_token is not defined or metrics_token == ''
      tags: [always]

    - name: Validate metrics scrape token is not a weak placeholder
      ansible.builtin.fail:
        msg: "metrics_token appears to be a weak placeholder; generate a strong random value with 'make infra-secrets'"
      when:
        - metrics_token is defined
        - metrics_token | length < 16 or metrics_token in ['changeme', 'metrics-token', 'token', 'secret']
      tags: [always]

  roles:
    - role: common
      tags: [common, setup]
    - role: eurtisan
      tags: [eurtisan, app]
