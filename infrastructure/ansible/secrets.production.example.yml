# Eurtisan PRODUCTION Vault template.
#
# Copy this to infrastructure/ansible/secrets.yml (alongside the staging keys),
# replace every CHANGE_ME with a real value, then re-encrypt:
#
#   ansible-vault encrypt secrets.yml
#
# Preflight rejects any value containing CHANGE_ME/placeholder, so nothing
# here can be deployed unmodified. Production uses the CANONICAL key names
# (staging values live under *_staging suffixes in the same Vault).
#
# Legend: [generate] = openssl/rclone on the controller, [provider] = fetch
# from the service's console, [runbook] = see docs/runbooks/.

# ── Core application (must differ from staging) ─────────────────────────
postgres_password: "CHANGE_ME"                     # [generate] openssl rand -base64 32
better_auth_secret: "CHANGE_ME"                    # [generate] openssl rand -base64 32
database_encryption_key: "CHANGE_ME"               # [generate] openssl rand -base64 32 (exact base64 of 32 bytes)
meilisearch_api_key: "CHANGE_ME"                   # [generate] openssl rand -base64 32 (>=16 bytes, MEILI_ENV=production)
s3_access_key_id: "CHANGE_ME"                      # [provider] Scaleway IAM project key scoped to the uploads bucket
s3_secret_access_key: "CHANGE_ME"                  # [provider] must differ from the registry pull secret
imgproxy_key: "CHANGE_ME"                          # [generate] openssl rand -hex 32
imgproxy_salt: "CHANGE_ME"                         # [generate] openssl rand -hex 32
metrics_token: "CHANGE_ME"                         # [generate] openssl rand -base64 32
grafana_admin_password: "CHANGE_ME"                # [generate] openssl rand -base64 24
# grafana_admin_ips is optional: leave unset to keep /grafana blocked (Caddy
# falls back to 0.0.0.0/32). Set space-separated CIDRs to allow admin access.
# grafana_admin_ips: "203.0.113.5/32 198.51.100.0/24"

# ── Payments and shipping ───────────────────────────────────────────────
mollie_api_key: "CHANGE_ME"                        # [provider] LIVE_ key (production preflight rejects test keys)
mollie_client_id: "CHANGE_ME"                      # [provider] Mollie app id (Connect)
mollie_client_secret: "CHANGE_ME"                  # [provider] Mollie app secret
sendcloud_public_key: "CHANGE_ME"                  # [provider]
sendcloud_secret_key: "CHANGE_ME"                  # [provider]
sendcloud_webhook_secret: "CHANGE_ME"              # [generate] openssl rand -hex 32 (must differ from the secret key)

# ── Email (production uses Brevo) ───────────────────────────────────────
brevo_api_key: "CHANGE_ME"                         # [provider] Brevo API v3 key (>=20 chars)
brevo_webhook_token: "CHANGE_ME"                   # [provider] webhook token, >=64 chars (docs/EMAIL_DNS.md)

# ── Signed release channel ──────────────────────────────────────────────
registry_push_access_key_id: "CHANGE_ME"           # [provider] Scaleway IAM key, controller push/pull for eurtisan/app
registry_push_secret_key: "CHANGE_ME"              # [provider]
registry_pull_access_key_id: "CHANGE_ME"           # [provider] separate IAM key, target pull-only
registry_pull_secret_key: "CHANGE_ME"              # [provider]
cosign_password: "CHANGE_ME"                       # [generate] protects the offline Cosign key (runbook: release-promotion-and-rollback.md)
promoted_staging_image_digest: "CHANGE_ME"         # [runbook] sha256:<digest> recorded during staging qualification

# ── Backups (production requires off-site + PITR) ───────────────────────
pgbackrest_repo_cipher_pass: "CHANGE_ME"           # [generate] openssl rand -base64 48
pgbackrest_s3_bucket: "CHANGE_ME"                  # [provider] bucket for the pgBackRest repository
pgbackrest_s3_access_key: "CHANGE_ME"              # [provider] least-privilege key for that bucket
pgbackrest_s3_secret_key: "CHANGE_ME"              # [provider]
backup_logical_cipher_pass: "CHANGE_ME"            # [generate] openssl rand -base64 48
backup_object_storage_endpoint: "CHANGE_ME"        # [provider] https://s3.<region>.scw.cloud for the backup buckets
backup_object_storage_region: "CHANGE_ME"          # [provider] e.g. fr-par
backup_logical_s3_bucket: "CHANGE_ME"              # [provider] bucket for encrypted logical dumps
backup_logical_s3_access_key: "CHANGE_ME"          # [provider] writer key for logical dumps
backup_logical_s3_secret_key: "CHANGE_ME"          # [provider]
backup_primary_uploads_access_key: "CHANGE_ME"     # [provider] READ-ONLY key for the production uploads bucket
backup_primary_uploads_secret_key: "CHANGE_ME"     # [provider]
backup_rclone_crypt_password: "CHANGE_ME"          # [generate] rclone obscure '<random passphrase>'

# ── Alerting (preflight requires at least one receiver) ─────────────────
# Configure EITHER the SMTP block OR alertmanager_webhook_url. Leave the other
# unset so preflight proves a real receiver exists.
alertmanager_smtp_host: ""                         # Brevo SMTP host
alertmanager_smtp_port: "587"
alertmanager_smtp_from: ""                         # e.g. alerts@mail.eurtisan.eu
alertmanager_smtp_to: ""                           # on-call inbox
# alertmanager_webhook_url: "https://hooks.example.com/services/..."   # alternative receiver

# ── Optional webhooks ───────────────────────────────────────────────────
# deploy_alert_webhook: ""                         # deploy.sh failure/success alerts
# deploy_notification_webhook: ""                  # posted after every Ansible rollout
# backup_alert_webhook: ""                         # backup failure alerts
