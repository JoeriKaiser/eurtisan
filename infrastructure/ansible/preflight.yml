---
- name: Validate Eurtisan deployment configuration without changing a host
  hosts: all
  gather_facts: false
  connection: local
  vars:
    ansible_python_interpreter: /usr/local/bin/python3.12
    release_version: "0000000000000000000000000000000000000000"
    image_tag: "000000000000"

  tasks:
    - name: Run the authoritative deployment preflight
      ansible.builtin.include_role:
        name: eurtisan
        tasks_from: preflight

    - name: Render the managed environment template without writing it
      ansible.builtin.template:
        src: roles/eurtisan/templates/.env.j2
        dest: "/tmp/eurtisan-{{ inventory_hostname }}.env"
        mode: "0600"
      check_mode: true
      changed_when: false

    - name: Render the managed Alertmanager template without writing it
      ansible.builtin.template:
        src: roles/eurtisan/templates/alertmanager.yml.j2
        dest: "/tmp/eurtisan-{{ inventory_hostname }}-alertmanager.yml"
        mode: "0600"
      check_mode: true
      changed_when: false
