services:
  db-test:
    image: postgres:16-alpine
    container_name: eurtisan-postgres-test
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: eurtisan
      POSTGRES_PASSWORD: eurtisan
      POSTGRES_DB: eurtisan_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurtisan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eurtisan

  db:
    image: postgres:16-alpine
    container_name: eurtisan-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: eurtisan
      POSTGRES_PASSWORD: eurtisan
      POSTGRES_DB: eurtisan
    volumes:
      - eurtisan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurtisan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eurtisan

  meilisearch:
    image: getmeili/meilisearch:v1.43.0
    container_name: eurtisan-meilisearch
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-meilisearch-api-key}
    volumes:
      - eurtisan_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eurtisan

  mailpit:
    image: axllent/mailpit:latest
    container_name: eurtisan-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - eurtisan_mailpit_data:/data
    environment:
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - eurtisan

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: eurtisan-garage
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  imgproxy:
    image: darthsim/imgproxy:v3
    container_name: eurtisan-imgproxy
    ports:
      - "8080:8080"
    env_file:
      - .env.garage
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://garage:3900
      IMGPROXY_S3_REGION: ${S3_REGION:-garage}
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: ""
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
    networks:
      - eurtisan
    depends_on:
      garage:
        condition: service_healthy

  app:
    build: .
    container_name: eurtisan-app
    ports:
      - "3000:3000"
    env_file:
      - .env.garage
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025
      MOCK_PAYMENTS_ENABLED: "true"
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: eurtisan-uploads
      IMGPROXY_BASE_URL: http://localhost:8080
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      VITE_IMGPROXY_BASE_URL: http://localhost:8080
      VITE_S3_BUCKET: eurtisan-uploads
      PLAYWRIGHT_BROWSERS_PATH: /app/node_modules/playwright-browsers
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      garage:
        condition: service_started
    volumes:
      - .:/app
      - eurtisan_node_modules:/app/node_modules
    networks:
      - eurtisan
    command: bun run dev

volumes:
  eurtisan_postgres_data:
  eurtisan_meilisearch_data:
  eurtisan_mailpit_data:
  eurtisan_node_modules:
  garage_meta:
  garage_data:

networks:
  eurtisan:
    driver: bridge
