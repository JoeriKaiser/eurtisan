services:
  db:
    image: postgres:16-alpine
    container_name: eurtisan-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eurtisan
      POSTGRES_PASSWORD: eurtisan
      POSTGRES_DB: eurtisan
    volumes:
      - eurtisan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurtisan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eurtisan

  app:
    build: .
    container_name: eurtisan-app
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - eurtisan_node_modules:/app/node_modules
    networks:
      - eurtisan
    command: bun run dev

volumes:
  eurtisan_postgres_data:
  eurtisan_node_modules:

networks:
  eurtisan:
    driver: bridge
