services:
  db-test:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: eurtisan-postgres-test
    restart: "no"
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      POSTGRES_USER: eurtisan
      POSTGRES_PASSWORD: eurtisan
      POSTGRES_DB: eurtisan_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurtisan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eurtisan

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: eurtisan-postgres
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: eurtisan
      POSTGRES_PASSWORD: eurtisan
      POSTGRES_DB: eurtisan
    volumes:
      - eurtisan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurtisan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eurtisan

  meilisearch:
    image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    container_name: eurtisan-meilisearch
    restart: "no"
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-meilisearch-api-key}
      MEILI_UPGRADE_DB: "true"
    volumes:
      - eurtisan_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eurtisan

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    container_name: eurtisan-mailpit
    restart: "no"
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - eurtisan_mailpit_data:/data
    environment:
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - eurtisan

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: eurtisan-garage
    restart: "no"
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  imgproxy:
    image: darthsim/imgproxy:v4.0.18@sha256:03aec6708216c3e017d7ad3fb08eba11d6b83be65556262f8d6cd72803fefeb6
    container_name: eurtisan-imgproxy
    restart: "no"
    ports:
      - "8080:8080"
    env_file:
      - .env.garage
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://garage:3900
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: ${S3_REGION:-garage}
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: ""
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
    networks:
      - eurtisan
    depends_on:
      garage:
        condition: service_healthy

  app:
    build: .
    container_name: eurtisan-app
    restart: "no"
    ports:
      - "3000:3000"
    env_file:
      - .env.garage
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025
      MOCK_PAYMENTS_ENABLED: "true"
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: http://localhost:3900
      S3_REGION: garage
      S3_BUCKET: eurtisan-uploads
      IMGPROXY_BASE_URL: http://localhost:8080
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      VITE_PUBLIC_URL: http://localhost:3000
      VITE_IMGPROXY_BASE_URL: http://localhost:8080
      VITE_S3_BUCKET: eurtisan-uploads
      VITE_FARO_ENABLED: "true"
      VITE_FARO_SAMPLE_RATE: "1"
      VITE_UMAMI_ENABLED: "false"
      VITE_ANALYTICS_CONSENT_REQUIRED: "false"
      PLAYWRIGHT_BROWSERS_PATH: /app/node_modules/playwright-browsers
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      garage:
        condition: service_started
    volumes:
      - .:/app
      - eurtisan_node_modules:/app/node_modules
    networks:
      - eurtisan
    command: bun run dev

  email-outbox-worker:
    build: .
    container_name: eurtisan-email-outbox-worker-dev
    restart: "no"
    env_file:
      - .env.garage
    environment:
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025
      MOCK_PAYMENTS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - eurtisan_node_modules:/app/node_modules
    networks:
      - eurtisan
    command: bun run job:email-outbox-worker

volumes:
  eurtisan_postgres_data:
  eurtisan_meilisearch_data:
  eurtisan_mailpit_data:
  eurtisan_node_modules:
  garage_meta:
  garage_data:

networks:
  eurtisan:
    driver: bridge
    name: eurtisan
