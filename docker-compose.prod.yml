# Production Docker Compose for Eurtisan
# Run on the VPS with: docker compose -f docker-compose.prod.yml up -d
#
# Image Pinning Policy:
# All third-party images are pinned to an immutable SHA256 digest to ensure
# reproducible deployments and prevent supply-chain drift from floating tags.
# When upgrading an image, update both the tag and the digest:
#   docker buildx imagetools inspect <image>:<tag> --format '{{.Manifest.Digest}}'

services:
  caddy:
    # Pinned digest for caddy:2-alpine
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    container_name: eurtisan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
    networks:
      - eurtisan
    depends_on:
      app:
        condition: service_healthy
      imgproxy:
        condition: service_healthy

  app:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eurtisan-app
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
      - db-internal
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    # Pinned digest for postgres:16-alpine
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: eurtisan-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    # Pinned digest for getmeili/meilisearch:v1.43.0
    image: getmeili/meilisearch:v1.43.0@sha256:5d4e1353927785744486fe317d263f442710ab5b27b1983aa1b719dfe2c665b6
    container_name: eurtisan-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - db-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  imgproxy:
    # Pinned digest for darthsim/imgproxy:v3
    image: darthsim/imgproxy:v3@sha256:419f92ee3a3137ddc2552a92ae2f46a97e9b8c22e03f8a6efa0cb217d8db7f45
    container_name: eurtisan-imgproxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT}
      IMGPROXY_S3_REGION: ${S3_REGION}
      IMGPROXY_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      IMGPROXY_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: ""
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  inventory-cleanup:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    container_name: eurtisan-inventory-cleanup
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
      - db-internal
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 5
        window: 120s
    command: >
      sh -c "bun run src/jobs/inventory-cleanup.ts"

  meilisearch-sync:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    container_name: eurtisan-meilisearch-sync
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
      - db-internal
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 5
        window: 120s
    command: >
      sh -c "bun run src/jobs/meilisearch-sync.ts"

  payout-reconciliation:
