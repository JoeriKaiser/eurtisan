# Production Docker Compose for Eurtisan
# Run on the VPS with: docker compose -f docker-compose.prod.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    container_name: eurtisan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
    networks:
      - eurtisan
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eurtisan-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: eurtisan-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.43.0
    container_name: eurtisan-meilisearch
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - eurtisan

  imgproxy:
    image: darthsim/imgproxy:v3
    container_name: eurtisan-imgproxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT}
      IMGPROXY_S3_REGION: ${S3_REGION}
      IMGPROXY_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      IMGPROXY_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: ""
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
    networks:
      - eurtisan

  inventory-cleanup:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eurtisan-inventory-cleanup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "bun run src/jobs/inventory-cleanup.ts"

  meilisearch-sync:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eurtisan-meilisearch-sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: >
      sh -c "bun run src/jobs/meilisearch-sync.ts"

volumes:
  postgres_data:
  meilisearch_data:
  caddy_data:
  caddy_config:

networks:
  eurtisan:
    driver: bridge
