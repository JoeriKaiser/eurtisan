# Staging Docker Compose — coexists with an existing reverse proxy (e.g. Coolify)
# The app binds only to localhost so the host proxy can reach it internally.
# No Caddy container — SSL and routing are handled by the existing proxy.
#
# Wire this up in Coolify:
#   Domain: staging.eurtisan.eu
#   Port:   3001   (or whatever you map below)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eurtisan-app-staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      # Direct access fallback (SSH tunnel or IP-whitelisted).
      # Traefik routes internally via the coolify network — this port is not required for that.
      - "127.0.0.1:3001:3000"
    networks:
      - eurtisan
      - coolify
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "app=eurtisan"
    # Routing is managed via file-based Traefik dynamic config written by Ansible
    # at /data/coolify/proxy/dynamic/eurtisan-staging.yml (see playbook).
    # Docker provider labels are NOT used so the route appears in Coolify's
    # proxy dynamic config directory.

  db:
    image: postgres:16-alpine
    container_name: eurtisan-db-staging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.43.0
    container_name: eurtisan-meilisearch-staging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - eurtisan

  mailpit:
    image: axllent/mailpit:latest
    container_name: eurtisan-mailpit-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - eurtisan

volumes:
  postgres_data:
  meilisearch_data:
  mailpit_data:

networks:
  # Shared with the observability stack (created by Ansible before compose up).
  eurtisan:
    external: true
  coolify:
    external: true
