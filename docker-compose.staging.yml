# Staging Docker Compose — coexists with an existing reverse proxy (e.g. Coolify)
# The app binds only to localhost so the host proxy can reach it internally.
# No Caddy container — SSL and routing are handled by the existing proxy.
#
# Wire this up in Coolify:
#   Domain: staging.eurtisan.eu
#   Port:   3000   (Traefik uses the shared Coolify network)
#
# REQUIRED in .env: PUBLIC_URL=https://staging.eurtisan.eu
# See .env.staging.example for the full template.

services:
  app:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        PUBLIC_ANALYTICS_CONSENT_REQUIRED: ${VITE_ANALYTICS_CONSENT_REQUIRED:?required public build value}
        PUBLIC_APP_ENV: ${VITE_APP_ENV:?required public build value}
        PUBLIC_APP_VERSION: ${VITE_APP_VERSION:?immutable release version required}
        PUBLIC_FARO_COLLECTOR_URL: ${VITE_FARO_COLLECTOR_URL:?required public build value}
        PUBLIC_FARO_ENABLED: ${VITE_FARO_ENABLED:?required public build value}
        PUBLIC_FARO_APP_NAME: ${VITE_FARO_APP_NAME:?required public build value}
        PUBLIC_FARO_SAMPLE_RATE: ${VITE_FARO_SAMPLE_RATE:?required public build value}
        PUBLIC_IMGPROXY_BASE_URL: ${VITE_IMGPROXY_BASE_URL:?required public build value}
        PUBLIC_MEILISEARCH_HOST: ${VITE_MEILISEARCH_HOST:?required public build value}
        PUBLIC_MEILISEARCH_VALUE: ${VITE_MEILISEARCH_SEARCH_KEY:?required public build value}
        PUBLIC_SITE_URL: ${VITE_PUBLIC_URL:?required public build value}
        PUBLIC_S3_BUCKET: ${VITE_S3_BUCKET:?required public build value}
        PUBLIC_UMAMI_ENABLED: ${VITE_UMAMI_ENABLED:?required public build value}
        PUBLIC_UMAMI_HOST_URL: ${VITE_UMAMI_HOST_URL:-}
        PUBLIC_UMAMI_SCRIPT_INTEGRITY: ${VITE_UMAMI_SCRIPT_INTEGRITY:-}
        PUBLIC_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
        PUBLIC_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    container_name: eurtisan-app-staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Hardcode Mailpit so staging can never accidentally send via Brevo,
      # even if a production .env is copied in by mistake.
      - EMAIL_SMTP_HOST=mailpit
      - EMAIL_SMTP_PORT=1025
    ports:
      # Direct access fallback (SSH tunnel or IP-whitelisted).
      # Traefik routes internally via the coolify network — this port is not required for that.
      - "127.0.0.1:3002:3000"
    networks:
      - eurtisan
      - coolify
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      imgproxy:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health/ready | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "app=eurtisan"
    # Routing is managed via file-based Traefik dynamic config written by Ansible
    # at /data/coolify/proxy/dynamic/eurtisan-staging.yml (see playbook).
    # Docker provider labels are NOT used so the route appears in Coolify's
    # proxy dynamic config directory.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g

  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: eurtisan-db-staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required database password}
      POSTGRES_DB: ${POSTGRES_DB:?required database name}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g

  meilisearch:
    image: getmeili/meilisearch:v1.43.0@sha256:5d4e1353927785744486fe317d263f442710ab5b27b1983aa1b719dfe2c665b6
    container_name: eurtisan-meilisearch-staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?required Meilisearch master key}
      # Without MEILI_ENV=production Meilisearch serves the search-preview UI
      # and enables vendor telemetry by default.
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - eurtisan
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2g

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    container_name: eurtisan-garage-staging
    restart: unless-stopped
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage.staging.toml:/etc/garage.toml:ro
    networks:
      - eurtisan
      - coolify
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  imgproxy:
    image: darthsim/imgproxy:v3@sha256:419f92ee3a3137ddc2552a92ae2f46a97e9b8c22e03f8a6efa0cb217d8db7f45
    container_name: eurtisan-imgproxy-staging
    restart: unless-stopped
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT:?required storage endpoint}
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: ${S3_REGION:?required storage region}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required storage access key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required storage secret key}
      IMGPROXY_KEY: ${IMGPROXY_KEY:?required imgproxy signing key}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?required imgproxy signing salt}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: ""
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
    networks:
      - eurtisan
      - coolify
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  mailpit:
    image: axllent/mailpit:v1.30.4@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    container_name: eurtisan-mailpit-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATA_FILE: /data/mailpit.db
    networks:
      - eurtisan
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  inventory-cleanup:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    container_name: eurtisan-inventory-cleanup-staging
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    command: >
      sh -c "bun run job:inventory-cleanup"

  meilisearch-sync:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    container_name: eurtisan-meilisearch-sync-staging
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
