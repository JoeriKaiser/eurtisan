# Staging Docker Compose — coexists with an existing reverse proxy (e.g. Coolify)
# The app binds only to localhost so the host proxy can reach it internally.
# No Caddy container — SSL and routing are handled by the existing proxy.
#
# Wire this up in Coolify:
#   Domain: staging.eurtisan.eu
#   Port:   3001   (or whatever you map below)
#
# REQUIRED in .env: PUBLIC_URL=https://staging.eurtisan.eu
# See .env.staging.example for the full template.

services:
  app:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eurtisan-app-staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Hardcode Mailpit so staging can never accidentally send via Brevo,
      # even if a production .env is copied in by mistake.
      - EMAIL_SMTP_HOST=mailpit
      - EMAIL_SMTP_PORT=1025
    ports:
      # Direct access fallback (SSH tunnel or IP-whitelisted).
      # Traefik routes internally via the coolify network — this port is not required for that.
      - "127.0.0.1:3001:3000"
    networks:
      - eurtisan
      - coolify
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "app=eurtisan"
    # Routing is managed via file-based Traefik dynamic config written by Ansible
    # at /data/coolify/proxy/dynamic/eurtisan-staging.yml (see playbook).
    # Docker provider labels are NOT used so the route appears in Coolify's
    # proxy dynamic config directory.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g

  db:
    image: postgres:16-alpine
    container_name: eurtisan-db-staging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g

  meilisearch:
    image: getmeili/meilisearch:v1.43.0
    container_name: eurtisan-meilisearch-staging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2g

  mailpit:
    image: axllent/mailpit:latest
    container_name: eurtisan-mailpit-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATA_FILE: /data/mailpit.db
    networks:
      - eurtisan
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  inventory-cleanup:
    image: eurtisan-app:${IMAGE_TAG:-latest}
    container_name: eurtisan-inventory-cleanup-staging
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - eurtisan
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    command: >
      sh -c "bun run job:inventory-cleanup"

  meilisearch-sync:
