    environment:
      - NODE_ENV=production
      - FINANCIAL_TOTALS_RECONCILIATION_INTERVAL_MS=${FINANCIAL_TOTALS_RECONCILIATION_INTERVAL_MS:-21600000}
      - FINANCIAL_TOTALS_RECONCILIATION_BATCH_SIZE=${FINANCIAL_TOTALS_RECONCILIATION_BATCH_SIZE:-500}
