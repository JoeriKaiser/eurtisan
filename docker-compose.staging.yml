# Staging Docker Compose — coexists with an existing reverse proxy (e.g. Coolify)
# The app binds only to localhost so the host proxy can reach it internally.
# No Caddy container — SSL and routing are handled by the existing proxy.
#
# Wire this up in Coolify:
#   Domain: staging.eurtisan.eu
#   Port:   3001   (or whatever you map below)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eurtisan-app-staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      # Bind to localhost only — external traffic must come through the host proxy
      - "127.0.0.1:3001:3000"
    networks:
      - eurtisan
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: eurtisan-db-staging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.43.0
    container_name: eurtisan-meilisearch-staging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - eurtisan
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  meilisearch_data:

networks:
  eurtisan:
    driver: bridge
