name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Validation only. No job deploys, accesses Vault, or contacts staging/provider accounts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Migrations, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Prepare safe local-only CI environment
        run: cp .env.example .env.local

      - name: Start Docker services
        run: make up

      - name: Install locked dependencies
        run: make install

      - name: Check formatting
        run: make format

      - name: Lint
        run: make lint

      - name: Type check
        run: make check

      - name: Audit production dependencies
        run: make audit-production

      - name: Compile i18n messages
        run: make i18n-compile

      - name: Validate migration chain
        run: make db-check

      - name: Apply full migration chain to a fresh isolated database
        run: make db-migrate-fresh

      - name: Apply migrations to the CI test database
        run: make db-migrate

      - name: Run focused accessibility component and static gates
        run: make test-accessibility

      - name: Run unit and browser tests with warning gate
        run: make test

      - name: Build production application with warning gate
        run: make build

      - name: Enforce measured client bundle budgets
        run: make bundle-check

      - name: Verify validation did not mutate tracked files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Stop Docker services
        if: always()
        run: docker compose down -v --remove-orphans

  production-image:
    name: Production Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Build and smoke-test production image configuration
        run: PRODUCTION_SMOKE_IMAGE=eurtisan-app:ci make production-image-smoke

  infrastructure:
    name: Compose, Workflow, Shell & Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate production and staging Compose models
        run: make compose-check

      - name: Validate GitHub Actions semantics
        run: make ci-workflow-check

      - name: Validate shell syntax
        run: make shell-syntax

      - name: Validate Ansible syntax, preflight, and templates
        run: make ansible-check

  prometheus-rules:
    name: Prometheus Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check Prometheus rules
        run: make promtool-check
