name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Validation only. No job deploys, accesses Vault, or contacts staging/provider accounts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Migrations, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      SKIP_DOCKER_ENSURE_UP: "true"
      SKIP_GARAGE_INIT: "true"
      VITEST_PARALLEL_WORKERS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare safe local-only CI environment
        run: cp .env.example .env.local

      - name: Build CI application image
        run: DOCKER_BUILDKIT=1 docker build --target runtime -t eurtisan-app:ci .

      - name: Start Docker services
        run: make up

      - name: Compile i18n messages
        run: make i18n-compile

      - name: Check formatting
        run: make format

      - name: Lint
        run: make lint

      - name: Type check
        run: make check

      - name: Audit production dependencies
        run: make audit-production

      - name: Validate migration chain
        run: make db-check

      - name: Apply full migration chain to a fresh isolated database
        run: make db-migrate-fresh

      - name: Apply migrations to the CI test database
        run: make db-migrate

      - name: Run unit and browser tests with warning gate
        run: make test

      - name: Build production application with warning gate
        run: make build

      - name: Enforce measured client bundle budgets
        run: make bundle-check

      # Production route generation intentionally excludes the development-only
      # Mollie mock route. Restore the committed development manifest after the
      # production artifacts and bundle budgets have been validated.
      - name: Restore development route tree
        run: git restore --source=HEAD -- src/routeTree.gen.ts

      - name: Verify validation did not mutate tracked files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Stop Docker services
        if: always()
        run: docker compose down -v --remove-orphans

  production-image:
    name: Production Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test production image configuration
        run: PRODUCTION_SMOKE_IMAGE=eurtisan-app:ci make production-image-smoke

  infrastructure:
    name: Compose, Workflow, Shell & Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production and staging Compose models
        run: make compose-check

      - name: Validate GitHub Actions semantics
        run: make ci-workflow-check

      - name: Validate shell syntax
        run: make shell-syntax

      - name: Validate Ansible syntax, preflight, and templates
        run: make ansible-check

  prometheus-rules:
    name: Prometheus Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Prometheus rules
        run: make promtool-check

      - name: Test Prometheus alert rules
        run: make promtool-test
