name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Validation only. This workflow never runs deploy.sh, changes infrastructure,
# or deploys to staging/production.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Quality (Lint, Test & Type Check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Prepare safe CI environment
        run: cp .env.example .env.local

      - name: Start Docker services
        run: make up

      - name: Install locked dependencies
        run: make install

      - name: Compile i18n messages
        run: make i18n-compile

      - name: Validate migration chain
        run: make db-check

      - name: Apply migrations to the CI database
        run: make db-migrate

      - name: Lint and format check
        run: make lint

      - name: Run unit and browser tests
        run: make test

      - name: Type check
        run: make check

      - name: Stop Docker services
        if: always()
        run: docker compose down -v --remove-orphans

  prometheus-rules:
    name: Prometheus Rules
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check Prometheus rules
        run: make promtool-check

  dockerfile-prod:
    name: Production Image & Script Validation
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build -f Dockerfile.prod -t eurtisan-app:ci .

      - name: Validate deploy script syntax
        run: bash -n infrastructure/ansible/files/deploy.sh

      - name: Validate backup script template syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          content = Path('infrastructure/ansible/roles/eurtisan/templates/backup.sh.j2').read_text()
          rendered = re.sub(r'\{\{[^}]+\}\}', "''", content)
          rendered = re.sub(r'\{%[^%]+%\}', '', rendered)
          Path('/tmp/backup-rendered.sh').write_text(rendered)
          PY
          bash -n /tmp/backup-rendered.sh

  ansible-syntax:
    name: Ansible Syntax
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@8d20150f024dcaa6f3b7bc2eb2ff0fedc8e5a510 # v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      - name: Syntax-check playbook
        run: ansible-playbook -i infrastructure/ansible/inventory/staging.example.yml infrastructure/ansible/playbook.yml --syntax-check
